name: Ubuntu-gcc

on:
  push:
    paths-ignore: ['docs/**', 'wiki/**', '**/*.md', '**/*.markdown', '**/*.rst', 'Makefile_old', '.gitattributes', '.gitignore', 'AUTHORS', 'LICENSE']
    branches: main
  pull_request:
    paths-ignore: ['docs/**', 'wiki/**', '**/*.md', '**/*.markdown', '**/*.rst', 'Makefile_old', '.gitattributes', '.gitignore', 'AUTHORS', 'LICENSE']
  # Run workflow on the 1st and 15th of every month at 7:33 AM PST (UTC-8)
  schedule:
    - cron: '33 15 1,15 * *'

jobs:
  con2prim-contracts:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Check strict C99 public header
        run: |
          printf '#include "ghl_con2prim.h"\nint main(void) { return 0; }\n' |
            gcc -std=c99 -pedantic-errors -I./GRHayL/include -x c - -c \
              -o "$RUNNER_TEMP/ghl_con2prim_header.o"
      - name: Replay Con2Prim fixture generator
        run: |
          testdata_ref=9fbd03ecedd5b161d1216e973d6a91f25f852a04
          git init "$RUNNER_TEMP/grhayl-testdata"
          git -C "$RUNNER_TEMP/grhayl-testdata" remote add origin \
            https://github.com/GRHayL/TestData.git
          git -C "$RUNNER_TEMP/grhayl-testdata" fetch --depth=1 origin "$testdata_ref"
          git -C "$RUNNER_TEMP/grhayl-testdata" checkout --detach FETCH_HEAD
          generated="$RUNNER_TEMP/con2prim-generated"
          mkdir "$generated"
          cd "$generated"
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$GITHUB_WORKSPACE/test/data_gen/unit_test_data_con2prim_multi_method_hybrid"
          for fixture in \
            metric_Bfield_initial_data.bin \
            apply_conservative_limits_input.bin \
            apply_conservative_limits_output.bin \
            apply_conservative_limits_output_pert.bin \
            con2prim_multi_method_hybrid_input.bin \
            con2prim_multi_method_hybrid_output.bin \
            con2prim_multi_method_hybrid_output_pert.bin \
            enforce_primitive_limits_and_compute_u0_input.bin \
            enforce_primitive_limits_and_compute_u0_output.bin \
            enforce_primitive_limits_and_compute_u0_output_pert.bin \
            compute_conservs_and_Tmunu_input.bin \
            compute_conservs_and_Tmunu_output.bin \
            compute_conservs_and_Tmunu_output_pert.bin; do
            cmp "$fixture" "$RUNNER_TEMP/grhayl-testdata/con2prim/$fixture"
          done
      - name: Check GRHayLib source links
        run: |
          for path in Atmosphere Con2Prim EOS Flux_Source GRHayL_Core \
                      Induction Neutrinos Reconstruction include; do
            test -L "implementations/GRHayLib/src/$path"
            test -e "implementations/GRHayLib/src/$path"
          done
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("GRHayL")
          registry = pathlib.Path("implementations/GRHayLib/src/make.code.defn").read_text()
          block = re.search(r"(?ms)^SUBDIRS\s*=\s*(.*?)(?=^\S|\Z)", registry)
          if block is None:
              raise SystemExit("GRHayLib SUBDIRS registry is missing")
          registered = set(re.findall(r"[A-Za-z0-9_./-]+", block.group(1).replace("\\", " ")))

          stale = sorted(
              path for path in registered
              if not (root / path).is_dir()
              or not (root / path / "make.code.defn").is_file()
          )
          if stale:
              raise SystemExit("GRHayLib SUBDIRS contains stale paths: "
                               + ", ".join(stale))

          expected = set()
          for manifest in root.rglob("make.code.defn"):
              text = manifest.read_text()
              sources = re.search(r"(?ms)^SRCS\s*=\s*(.*?)(?=^\S|\Z)", text)
              if sources and re.search(r"\.(?:c|cc)\b", sources.group(1)):
                  expected.add(str(manifest.parent.relative_to(root)))

          missing = sorted(expected - registered)
          if missing:
              raise SystemExit("GRHayLib SUBDIRS misses source-bearing directories: "
                               + ", ".join(missing))

          params = pathlib.Path("implementations/GRHayLib/param.ccl").read_text()
          implementation = pathlib.Path(
              "implementations/GRHayLib/src/initialize_and_shutdown.c"
          ).read_text()

          def keyword_values(declaration):
              match = re.search(
                  rf"(?m)^KEYWORD\s+{re.escape(declaration)}(?=\s).*$", params
              )
              if match is None:
                  raise SystemExit(f"missing CCL keyword {declaration}")
              start = params.index("{", match.end())
              end = params.index("\n}", start)
              return set(re.findall(
                  r'(?m)^\s*"([^"]+)"\s*::', params[start:end]
              ))

          main_keywords = keyword_values("con2prim_routine")
          backup_keywords = keyword_values("con2prim_backup_routines[3]")
          parser_start = implementation.index("\nint parse_C2P_routine_keyword(")
          parser_end = implementation.index(
              "\nstatic int parse_eos_table_type_keyword", parser_start
          )
          parser_keywords = set(re.findall(
              r'CCTK_EQUALS\(routine_name,\s*"([^"]+)"\)',
              implementation[parser_start:parser_end]
          ))
          if parser_keywords != main_keywords | backup_keywords:
              raise SystemExit("Con2Prim CCL/parser keyword mismatch")

          simple_start = implementation.index(
              '  if( CCTK_EQUALS(EOS_type, "Simple") ) {'
          )
          hybrid_start = implementation.index(
              '  } else if( CCTK_EQUALS(EOS_type, "Hybrid") ) {', simple_start
          )
          tabulated_start = implementation.index(
              '  } else if( CCTK_EQUALS(EOS_type, "Tabulated") ) {', hybrid_start
          )
          entropy_start = implementation.index(
              "  if(!evolve_entropy) {", tabulated_start
          )
          paramcheck_end = implementation.index(
              "\n}\n\nvoid GRHayLib_initialize", entropy_start
          )
          validation_blocks = {
              "simple": implementation[simple_start:hybrid_start],
              "hybrid": implementation[hybrid_start:tabulated_start],
              "tabulated": implementation[tabulated_start:entropy_start],
              "entropy": implementation[entropy_start:paramcheck_end],
          }
          expected_incompatible = {
              "simple": {"Font1D", "Newman1D", "Newman1D_entropy"},
              "hybrid": {"Newman1D", "Newman1D_entropy"},
              "tabulated": {
                  "Font1D", "Noble1D", "Noble1D_entropy", "Noble1D_entropy2"
              },
              "entropy": {
                  "Noble1D_entropy", "Noble1D_entropy2",
                  "Newman1D_entropy", "Palenzuela1D_entropy"
              },
          }
          for family, validation in validation_blocks.items():
              main_checked = set(re.findall(
                  r'CCTK_EQUALS\(con2prim_routine,\s*"([^"]+)"\)', validation
              ))
              backup_checked = set(re.findall(
                  r'CCTK_EQUALS\(con2prim_backup_routines\[i\],\s*"([^"]+)"\)',
                  validation
              ))
              expected_checked = expected_incompatible[family]
              if main_checked != expected_checked or backup_checked != expected_checked:
                  raise SystemExit(
                      f"Con2Prim {family} main/backup validation mismatch"
                  )
              if not re.search(
                  r'con2prim_backup_routines\[%d\].*?\bi,\s*'
                  r'con2prim_backup_routines\[i\]', validation, re.S
              ):
                  raise SystemExit(
                      f"Con2Prim {family} backup diagnostic omits its slot"
                  )
          PY
      - name: Generate HDF5 coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'
      - name: Run Con2Prim memory checks
        run: |
          sudo apt-get install -y valgrind
          make realclean
          CC=gcc ./configure --buildtype=plain --prefix="$RUNNER_TEMP/grhayl-valgrind" \
            --builddir=build-valgrind
          make tests datagen
          export LD_LIBRARY_PATH="$PWD/build-valgrind/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          valgrind --error-exitcode=1 --track-origins=yes \
            ./test/data_gen/unit_test_data_con2prim_multi_method_hybrid
          valgrind --error-exitcode=1 --track-origins=yes \
            ./test/unit_test_hybrid_failure
          valgrind --error-exitcode=1 --track-origins=yes \
            ./test/unit_test_c2p_nn_guess
      - name: Build and test without HDF5
        run: |
          make realclean
          CC=gcc ./configure --disable-hdf5 --prefix="$RUNNER_TEMP/grhayl-nohdf" \
            --builddir=build-nohdf --cflags='-ftest-coverage -fprofile-arcs'
          make tests install
          LD_LIBRARY_PATH="$PWD/build-nohdf/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ./test/unit_test_c2p_nn_guess
          for symbol in \
            ghl_tabulated_Noble2D \
            ghl_tabulated_Palenzuela1D_energy \
            ghl_tabulated_Palenzuela1D_entropy \
            ghl_tabulated_Newman1D_energy \
            ghl_tabulated_Newman1D_entropy \
            ghl_calculate_HLLE_fluxes_dirn0_tabulated \
            ghl_calculate_HLLE_fluxes_dirn1_tabulated \
            ghl_calculate_HLLE_fluxes_dirn2_tabulated \
            ghl_calculate_HLLE_fluxes_dirn0_tabulated_entropy \
            ghl_calculate_HLLE_fluxes_dirn1_tabulated_entropy \
            ghl_calculate_HLLE_fluxes_dirn2_tabulated_entropy; do
            nm -D --defined-only build-nohdf/lib/libghl.so | grep -w "$symbol"
          done
      - name: Generate no-HDF5 coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  ET-Legacy:
    strategy:
      fail-fast: false
      matrix:
        test-function: [conservs, primitives, induction_gauge_rhs, HLL_flux, reconstruction, flux_source]
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy test data to working directory
        run: |
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/ET_Legacy/ET_Legacy_${{ matrix.test-function }}_input.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/ET_Legacy/ET_Legacy_${{ matrix.test-function }}_output.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/ET_Legacy/ET_Legacy_${{ matrix.test-function }}_output_pert.bin
      - name: Run ET IllinoisGRMHD unit test for ET_Legacy_${{ matrix.test-function }}
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_ET_Legacy_${{ matrix.test-function }}
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  c2p-routines:
    strategy:
      fail-fast: false
      matrix:
        test-function: [apply_conservative_limits, con2prim_multi_method_hybrid, enforce_primitive_limits_and_compute_u0, compute_conservs_and_Tmunu]
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy test data to working directory
        run: |
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/metric_Bfield_initial_data.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/${{ matrix.test-function }}_input.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/${{ matrix.test-function }}_output.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/${{ matrix.test-function }}_output_pert.bin
      - name: Run con2prim unit test for ${{ matrix.test-function }} functions
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_${{ matrix.test-function }}
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  c2p-failure:
    strategy:
      fail-fast: false
      matrix:
        test-function: [hybrid_failure, c2p_nn_guess]
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Run con2prim unit test for ${{ matrix.test-function }} function
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_${{ matrix.test-function }}
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  tabulated-eos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy test data to working directory
        run: curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/EOS/simple_table.h5
      - name: Run tabulated EOS unit test
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_tabulated_eos simple_table.h5
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  piecewise-polytrope-eos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Run piecewise polytrope EOS unit test
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_piecewise_polytrope
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  grhayl-core:
