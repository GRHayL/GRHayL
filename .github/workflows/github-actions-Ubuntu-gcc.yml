name: Ubuntu-gcc

on:
  push:
    paths-ignore: ['docs/**', 'wiki/**', '**/*.md', '**/*.markdown', '**/*.rst', 'Makefile_old', '.gitattributes', '.gitignore', 'AUTHORS', 'LICENSE']
    branches: main
  pull_request:
    paths-ignore: ['docs/**', 'wiki/**', '**/*.md', '**/*.markdown', '**/*.rst', 'Makefile_old', '.gitattributes', '.gitignore', 'AUTHORS', 'LICENSE']
  # Run workflow on the 1st and 15th of every month at 7:33 AM PST (UTC-8)
  schedule:
    - cron: '33 15 1,15 * *'

jobs:
  ET-Legacy:
    strategy:
      fail-fast: false
      matrix:
        test-function: [conservs, primitives, induction_gauge_rhs, HLL_flux, reconstruction, flux_source]
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy test data to working directory
        run: |
          testdata_ref=$(cat .github/et-legacy-testdata-ref)
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/${testdata_ref}/ET_Legacy/ET_Legacy_${{ matrix.test-function }}_input.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/${testdata_ref}/ET_Legacy/ET_Legacy_${{ matrix.test-function }}_output.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/${testdata_ref}/ET_Legacy/ET_Legacy_${{ matrix.test-function }}_output_pert.bin
      - name: Run ET IllinoisGRMHD unit test for ET_Legacy_${{ matrix.test-function }}
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_ET_Legacy_${{ matrix.test-function }}
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  c2p-routines:
    strategy:
      fail-fast: false
      matrix:
        test-function: [apply_conservative_limits, con2prim_multi_method_hybrid, enforce_primitive_limits_and_compute_u0, compute_conservs_and_Tmunu]
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy test data to working directory
        run: |
          testdata_ref=$(cat .github/con2prim-testdata-ref)
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/${testdata_ref}/con2prim/metric_Bfield_initial_data.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/${testdata_ref}/con2prim/${{ matrix.test-function }}_input.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/${testdata_ref}/con2prim/${{ matrix.test-function }}_output.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/${testdata_ref}/con2prim/${{ matrix.test-function }}_output_pert.bin
      - name: Run con2prim unit test for ${{ matrix.test-function }} functions
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_${{ matrix.test-function }}
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  c2p-failure:
    strategy:
      fail-fast: false
      matrix:
        test-function: [hybrid_failure, c2p_nn_guess]
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Run con2prim unit test for ${{ matrix.test-function }} function
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_${{ matrix.test-function }}
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  tabulated-eos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy test data to working directory
        run: curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/EOS/simple_table.h5
      - name: Run tabulated EOS unit test
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_tabulated_eos simple_table.h5
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  piecewise-polytrope-eos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Run piecewise polytrope EOS unit test
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_piecewise_polytrope
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  grhayl-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy test data to working directory
        run: |
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/grhayl_core/grhayl_core_test_suite_input.bin
      - name: Run GRHayL_Core unit test
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_grhayl_core_test_suite
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  flux:
    strategy:
      fail-fast: false
      matrix:
        test-function: [hybrid_flux, tabulated_flux]
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy test data to working directory
        run: |
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/flux_source/${{ matrix.test-function }}_input.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/flux_source/${{ matrix.test-function }}_output.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/flux_source/${{ matrix.test-function }}_output_pert.bin
          curl -O https://stellarcollapse.org/EOS/LS220_234r_136t_50y_analmu_20091212_SVNr26.h5.bz2 && bunzip2 LS220_234r_136t_50y_analmu_20091212_SVNr26.h5.bz2
      - name: Run flux unit test for ${{ matrix.test-function }} function
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_${{ matrix.test-function }}
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  reconstruction:
    strategy:
      fail-fast: false
      matrix:
        test-function: [PLM_reconstruction, WENOZ_reconstruction]
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy test data to working directory
        run: |
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/reconstruction/${{ matrix.test-function }}_input.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/reconstruction/${{ matrix.test-function }}_output.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/reconstruction/${{ matrix.test-function }}_output_pert.bin
      - name: Run reconstruction unit test for ${{ matrix.test-function }} function
        run: LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_${{ matrix.test-function }}
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  neutrinos:
    strategy:
      fail-fast: false
      matrix:
        test-function: [nrpyleakage_optically_thin_gas, nrpyleakage_constant_density_sphere, nrpyleakage_luminosities]
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Check NRPyLeakage floating-point flag policy
        if: matrix.test-function == 'nrpyleakage_optically_thin_gas' && matrix.os == 'ubuntu-22.04'
        run: |
          unsafe_flags=$(./configure --help | sed -n 's/^    NRPyLeakage rejects: //p')
          test -n "$unsafe_flags"
          for flag in $unsafe_flags; do
            case_dir=$(mktemp -d)
            git archive HEAD | tar -x -C "$case_dir"
            if (cd "$case_dir" && ./configure --disable-hdf5 --cflags="$flag") >"$case_dir/configure.log" 2>&1; then
              echo "configure accepted unsupported flag $flag"
              exit 1
            fi
            grep -q "Unsupported floating-point compiler flag" "$case_dir/configure.log"
          done
          case_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "$case_dir"
          if (cd "$case_dir" && CC='gcc -fno-signed-zeros' ./configure --disable-hdf5) >"$case_dir/configure.log" 2>&1; then
            echo "configure accepted unsupported flag from CC"
            exit 1
          fi
          grep -q "Unsupported floating-point compiler flag" "$case_dir/configure.log"
          test ! -e "$case_dir/Makefile"
          case_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "$case_dir"
          (cd "$case_dir" && ./configure --disable-hdf5 --cflags="-Wextra")
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Check NRPyLeakage strict-aliasing compilation
        if: matrix.test-function == 'nrpyleakage_optically_thin_gas' && matrix.os == 'ubuntu-22.04'
        run: |
          gcc -std=c99 -O2 -DGHL_DISABLE_HDF5 -fstrict-aliasing \
            -Wstrict-aliasing=2 -Werror=strict-aliasing \
            -I./GRHayL/include \
            -c Unit_Tests/unit_test_nrpyleakage_physics.c \
            -o "$RUNNER_TEMP/unit_test_nrpyleakage_physics.o"
      - name: Run table-free neutrino physics checks
        if: matrix.test-function == 'nrpyleakage_optically_thin_gas'
        run: |
          LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_nrpyleakage_physics
          LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib ./test/unit_test_nrpyleakage_classifier_fallback
      - name: Copy test data to working directory
        run: |
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/Neutrinos/${{ matrix.test-function }}_unperturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/Neutrinos/${{ matrix.test-function }}_perturbed.bin
          curl -O https://stellarcollapse.org/EOS/SLy4_3335_rho391_temp163_ye66.h5.bz2 && bunzip2 SLy4_3335_rho391_temp163_ye66.h5.bz2
      - name: Run neutrinos unit test for ${{ matrix.test-function }} function
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib
          ./test/unit_test_${{ matrix.test-function }} SLy4_3335_rho391_temp163_ye66.h5 1
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  con-to-prim-tabulated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Install pyghl
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyghl==0.4.0
      - name: Copy test data to working directory
        run: |
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Palenzuela1D_rho_vs_T_unperturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Palenzuela1D_Pmag_vs_Wm1_unperturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Palenzuela1D_rho_vs_T_perturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Palenzuela1D_Pmag_vs_Wm1_perturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Palenzuela1D_entropy_rho_vs_T_unperturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Palenzuela1D_entropy_Pmag_vs_Wm1_unperturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Palenzuela1D_entropy_rho_vs_T_perturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Palenzuela1D_entropy_Pmag_vs_Wm1_perturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Newman1D_rho_vs_T_unperturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Newman1D_Pmag_vs_Wm1_unperturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Newman1D_rho_vs_T_perturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Newman1D_Pmag_vs_Wm1_perturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Newman1D_entropy_rho_vs_T_unperturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Newman1D_entropy_Pmag_vs_Wm1_unperturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Newman1D_entropy_rho_vs_T_perturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Newman1D_entropy_Pmag_vs_Wm1_perturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Noble2D_rho_vs_T_unperturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Noble2D_Pmag_vs_Wm1_unperturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Noble2D_rho_vs_T_perturbed.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/con2prim/con2prim_tabulated_Noble2D_Pmag_vs_Wm1_perturbed.bin
          curl -O https://stellarcollapse.org/EOS/SLy4_3335_rho391_temp163_ye66.h5.bz2 && bunzip2 SLy4_3335_rho391_temp163_ye66.h5.bz2
          pyghl append SLy4_3335_rho391_temp163_ye66.h5
      - name: Run unit test for tabulated EOS Con2Prim routines
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib
          ./test/unit_test_con2prim_tabulated SLy4_3335_rho391_temp163_ye66.h5 1
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  code-failure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy EOS table to working directory
        run: |
          curl -O https://stellarcollapse.org/EOS/SLy4_3335_rho391_temp163_ye66.h5.bz2 && bunzip2 SLy4_3335_rho391_temp163_ye66.h5.bz2
      - name: Run unit test for error-catching
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib
          for i in {0..87}; do
            if ./test/unit_test_code_error "$i"; then
              echo "Failed to fail!"
              exit 1
            else
              echo "Failed successfully!"
            fi
          done
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  induction-interpolators:
    strategy:
      fail-fast: false
      matrix:
        metric: [BSSN, ADM]
        centering: [ccc, vvv]
        os: [ubuntu-22.04, ubuntu-24.04]
        exclude:
          - metric: BSSN
            centering: vvv
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy test data to working directory
        run: |
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/induction/induction_interpolation_input.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/induction/induction_interpolation_${{ matrix.metric }}_input.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/induction/induction_interpolation_${{ matrix.centering }}_${{ matrix.metric }}_output.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/induction/induction_interpolation_${{ matrix.centering }}_${{ matrix.metric }}_output_pert.bin
      - name: Run interpolation test using ${{ matrix.metric }} metric with ${{ matrix.centering }}-centering
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib
          ./test/unit_test_induction_${{ matrix.centering }}_${{ matrix.metric }}
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  induction-flux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Copy test data to working directory
        run: |
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/induction/HLL_flux_input.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/induction/HLL_flux_with_B_output.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/induction/HLL_flux_with_B_output_pert.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/induction/HLL_flux_with_Btilde_output.bin
          curl -O https://raw.githubusercontent.com/GRHayL/TestData/main/induction/HLL_flux_with_Btilde_output_pert.bin
      - name: Run test of HLL flux functions
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/lib
          ./test/unit_test_HLL_flux
      - name: Generate coverage report
        uses: ./.github/actions/code-coverage
        with:
          compiler: 'gcc'

  compose-regularized-eos:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Setup OS and compiler
        uses: ./.github/actions/OS_setup
        with:
          compiler: 'gcc'
      - name: Install converter test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/compose/requirements.txt coverage
      - name: Test converter with 100% branch coverage
        run: |
          python3 -m coverage run --branch --source=tools/compose \
            --omit='Unit_Tests/*' -m unittest discover \
            -s Unit_Tests/compose -p 'test_*.py'
          python3 -m coverage report --fail-under=100
          python3 -m coverage xml -o compose-coverage.xml
      - name: Compile GRHayL
        uses: ./.github/actions/compile_GRHayL
        with:
          compiler: 'gcc'
      - name: Build synthetic regularized table
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from Unit_Tests.compose.test_compose_to_grhayl import _write_fixture

          input_dir = Path("compose-test-input")
          input_dir.mkdir()
          _write_fixture(input_dir)
          PY
          python3 tools/compose/compose_to_grhayl.py \
            --input-dir compose-test-input \
            --profile test-analytic \
            --output compose-test-table.h5
      - name: Test unchanged StellarCollapse runtime
        run: |
          export LD_LIBRARY_PATH="$PWD/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./test/unit_test_tabulated_eos_compose compose-test-table.h5
      - name: Upload converter coverage only
        uses: codecov/codecov-action@v5
        with:
          files: compose-coverage.xml
          flags: compose
          disable_search: true
          fail_ci_if_error: true

  codecov-finalize:
    name: Codecov final status
    if: ${{ always() }}
    needs:
      - ET-Legacy
      - c2p-routines
      - c2p-failure
      - tabulated-eos
      - piecewise-polytrope-eos
      - grhayl-core
      - flux
      - reconstruction
      - neutrinos
      - con-to-prim-tabulated
      - code-failure
      - induction-interpolators
      - induction-flux
      - compose-regularized-eos
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Wait for every coverage workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_run=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          created_at=$(jq -r .created_at <<<"$current_run")
          head_sha=$(jq -r .head_sha <<<"$current_run")
          window_start=$(date -u -d "$created_at - 5 minutes" +%Y-%m-%dT%H:%M:%SZ)

          pending=""
          for attempt in $(seq 1 300); do
            runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs" \
              --method GET \
              -f head_sha="$head_sha" \
              -f event="$GITHUB_EVENT_NAME" \
              -f per_page=100)
            pending=$(jq -r --arg start "$window_start" '
              .workflow_runs
              | map(select(
                  (.name == "MacOS-gcc"
                   or .name == "Ubuntu-clang"
                   or .name == "Ubuntu-intel")
                  and .created_at >= $start
                  and .status != "completed"))
              | map(.name)
              | unique
              | join(", ")
            ' <<<"$runs")
            if [[ -z "$pending" ]]; then
              break
            fi
            echo "Waiting for coverage workflows: $pending"
            sleep 30
          done

          if [[ -n "$pending" ]]; then
            echo "Timed out waiting for coverage workflows: $pending" >&2
            exit 1
          fi
      - name: Publish final Codecov status
        uses: codecov/codecov-action@v5
        with:
          run_command: send-notifications
          use_oidc: true
          fail_ci_if_error: true
