name: code-coverage
description: 'Uses gcovr and Codecov to generate code coverage report'
inputs:
  compiler:
    description: compiler for test
    required: true
  report_file:
    description: Optional gcovr Cobertura report to upload without auto-discovery
    required: false
    default: ''
  report_filter:
    description: Source filter for the optional gcovr report
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - if: runner.os == 'Linux' && inputs.compiler == 'gcc'
      run: |
        if [[ -n "$COVERAGE_REPORT_FILE" ]]; then
          # Branch-only exclusion markers require gcovr >= 8.4. Pin the
          # version measured by the scoped M1 coverage audit.
          python3 -m pip install gcovr==8.6
          gcovr_command=(python3 -m gcovr)
          gcovr_args=(-r . --filter "$COVERAGE_REPORT_FILTER" --xml "$COVERAGE_REPORT_FILE")
        else
          sudo apt-get install gcovr
          gcovr_command=(gcovr)
          # Upload the same gcovr XML format as the scoped M1 jobs. Raw .gcov
          # auto-discovery reintroduces excluded and non-executable lines.
          gcovr_args=(-r . --exclude 'GRHayL/(Radiation/|include/ghl_m1\.h$)' --xml coverage.xml)
        fi
        # Newer versions need a new flag; we can get rid of
        # this once we move past Ubuntu 22
        if [ $ImageOS == "ubuntu22" ]; then
          "${gcovr_command[@]}" "${gcovr_args[@]}"
        else
          "${gcovr_command[@]}" "${gcovr_args[@]}" --gcov-ignore-errors no_working_dir_found
        fi
        if [[ -n "$COVERAGE_REPORT_FILE" ]]; then
          "${gcovr_command[@]}" -r . --filter 'GRHayL/Radiation/' --fail-under-line 100 --txt
          "${gcovr_command[@]}" -r . --filter 'GRHayL/Radiation/' --txt-metric branch --txt
        fi
      shell: bash
      env:
        COVERAGE_REPORT_FILE: ${{ inputs.report_file }}
        COVERAGE_REPORT_FILTER: ${{ inputs.report_filter }}

    # This still doesn't generate expected cov. files
    - if: runner.os == 'Linux' && inputs.compiler == 'clang'
      run: |
        LLVM_PROFDATA="$(ls /usr/bin/llvm-profdata-* | sort -V | tail -n 1)"
        LLVM_COV="$(ls /usr/bin/llvm-cov-* | sort -V | tail -n 1)"

        test -x "$LLVM_PROFDATA"
        test -x "$LLVM_COV"

        "$LLVM_PROFDATA" merge -sparse default.profraw -o coverage.profdata
        "$LLVM_COV" export ./build/lib/libghl.so -instr-profile=coverage.profdata -format=lcov \
          -ignore-filename-regex='GRHayL/(Radiation/|include/ghl_m1\.h$|GRHayL_Core/abort_if_error\.c$|Flux_Source/ghl_calculate_Rusanov_flux\.c$)' > coverage.lcov
      shell: bash

    # Try Intel's codecov tool? Not sure if this is compatible with gcovr
    - if: runner.os == 'Linux' && inputs.compiler == 'intel'
      run: |
        #sudo apt-get install gcovr
        #if [ $ImageOS == "ubuntu22" ]; then
        #  gcovr -r . --keep
        #else
        #  gcovr -r . --keep --gcov-ignore-errors no_working_dir_found
        #fi
      shell: bash

    # These probably fail because we need to tell gcovr to
    # use the installed versions and not whatever MacOS
    # ships with
    - if: runner.os == 'MacOS' && inputs.compiler == 'gcc'
      run: |
        #brew install gcovr
        #gcovr -r ./build --keep
      shell: bash

    - if: runner.os == 'MacOS' && inputs.compiler == 'clang'
      run: |
        #brew install gcovr
        #gcovr -r . --gcov-executable "llvm-cov gcov" --keep
      shell: bash

    - uses: codecov/codecov-action@v5
      with:
        files: ${{ inputs.compiler == 'gcc' && (inputs.report_file || 'coverage.xml') || 'coverage.lcov' }}
        disable_search: true
        fail_ci_if_error: ${{ inputs.report_file != '' }}
