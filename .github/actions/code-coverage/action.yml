name: code-coverage
description: 'Uses gcovr and Codecov to generate code coverage report'
inputs:
  compiler:
    description: compiler for test
    required: true

runs:
  using: "composite"
  steps:
    # Radiation is measured by the dedicated M1 upload (flag m1). These jobs
    # never run Radiation code, so any Radiation lines they upload can only
    # appear as unhit lines in the merged report. Drop Radiation's gcov
    # notes/data before gcovr and the Codecov uploader gather them.
    - run: find . -path '*/Radiation/*' \( -name '*.gcno' -o -name '*.gcda' \) -delete
      shell: bash

    - if: runner.os == 'Linux' && inputs.compiler == 'gcc'
      run: |
        sudo apt-get install gcovr
        # Newer versions need a new flag; we can get rid of
        # this once we move past Ubuntu 22
        if [ $ImageOS == "ubuntu22" ]; then
          gcovr -r . --keep
        else
          gcovr -r . --keep --gcov-ignore-errors no_working_dir_found
        fi
      shell: bash

    # This still doesn't generate expected cov. files
    - if: runner.os == 'Linux' && inputs.compiler == 'clang'
      run: |
        LLVM_PROFDATA="$(ls /usr/bin/llvm-profdata-* | sort -V | tail -n 1)"
        LLVM_COV="$(ls /usr/bin/llvm-cov-* | sort -V | tail -n 1)"

        test -x "$LLVM_PROFDATA"
        test -x "$LLVM_COV"

        "$LLVM_PROFDATA" merge -sparse default.profraw -o coverage.profdata
        # The M1 upload reports Radiation, ghl_m1.h and abort_if_error.c (see
        # the first step and the m1-code-coverage filter). llvm-cov also lists
        # lines gcov does not treat as executable (error returns, signature and
        # continuation lines, #define constants), which no job can ever hit, so
        # keep those files, and the constants header, out of this report.
        "$LLVM_COV" export ./build/lib/libghl.so -instr-profile=coverage.profdata -format=lcov \
          -ignore-filename-regex='GRHayL/(Radiation/|include/ghl_m1\.h$|include/ghl_nrpyleakage\.h$|GRHayL_Core/abort_if_error\.c$)' > coverage.lcov
      shell: bash

    # Try Intel's codecov tool? Not sure if this is compatible with gcovr
    - if: runner.os == 'Linux' && inputs.compiler == 'intel'
      run: |
        #sudo apt-get install gcovr
        #if [ $ImageOS == "ubuntu22" ]; then
        #  gcovr -r . --keep
        #else
        #  gcovr -r . --keep --gcov-ignore-errors no_working_dir_found
        #fi
      shell: bash

    # These probably fail because we need to tell gcovr to
    # use the installed versions and not whatever MacOS
    # ships with
    - if: runner.os == 'MacOS' && inputs.compiler == 'gcc'
      run: |
        #brew install gcovr
        #gcovr -r ./build --keep
      shell: bash

    - if: runner.os == 'MacOS' && inputs.compiler == 'clang'
      run: |
        #brew install gcovr
        #gcovr -r . --gcov-executable "llvm-cov gcov" --keep
      shell: bash

    - uses: codecov/codecov-action@v5
